### CCOP Text2Cypher v3.7 SFT — Qwen2.5-7B-Instruct LoRA
### 학습 데이터: t2c_v37 (28,109 train / 3,117 eval, 층화 분할)
### 목표: AgensGraph Cypher 특화 Text2Cypher (v3.7 온톨로지)
### 베이스 교체 사유:
###   - EXAONE-3.5: RTX 5090(SM_120) + transformers 4.57.1 + custom code 호환성 문제
###   - Qwen2.5-7B: 표준 Llama 아키텍처(custom code 0), vLLM 1급 지원, transformers 안정
### 기준: ONTOLOGY_FINAL_ARCHITECTURE_v3.7.md (25노드, 53엣지)

### ── 모델 ──────────────────────────────────────────────────────────
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: false             # Qwen2.5는 표준 transformers 클래스 사용 → 불필요

### ── 학습 방식 ──────────────────────────────────────────────────────
stage: sft
do_train: true
finetuning_type: lora

### ── LoRA 설정 ─────────────────────────────────────────────────────
### v3.7 EXAONE 설정 그대로 유지 (검증된 hyperparameter)
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### ── 데이터셋 ───────────────────────────────────────────────────────
dataset: t2c_v37
eval_dataset: t2c_v37_eval
dataset_dir: /home/ai-kyw-dev/ccop_train/train
template: qwen                       # qwen2.5 chat template

cutoff_len: 1536
overwrite_cache: true
preprocessing_num_workers: 4

### ── 학습 하이퍼파라미터 ────────────────────────────────────────────
output_dir: /home/ai-kyw-dev/ccop_train/train/output/qwen25_t2c_v37
per_device_train_batch_size: 2      # rank 64 + QLoRA 4bit, RTX 5090 32GB
gradient_accumulation_steps: 8     # 유효 배치 크기: 16
num_train_epochs: 3
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01

### ── 정밀도 및 메모리 ───────────────────────────────────────────────
bf16: true
quantization_bit: 4                # QLoRA — RTX 5090 32GB 기준
optim: adamw_torch_fused
ddp_find_unused_parameters: false

### ── 저장 및 로깅 ───────────────────────────────────────────────────
save_strategy: epoch
save_total_limit: 3
logging_steps: 50
report_to: none

### ── 평가 ─────────────────────────────────────────────────────────
eval_strategy: epoch
per_device_eval_batch_size: 4

### ── 추론 최적화 (학습 후 vLLM 서빙용) ────────────────────────────
### merge 후: python merge_lora.py --base Qwen/Qwen2.5-7B-Instruct --lora_path output/qwen25_t2c_v37 --output_dir output/qwen25_t2c_v37_merged
### 서빙: vllm serve output/qwen25_t2c_v37_merged --served-model-name qwen25_t2c_v37 --host 0.0.0.0 --port 8000
###       (Qwen2.5는 trust_remote_code 불필요)
