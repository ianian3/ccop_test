<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="질의 1건당 LLM 토큰 소모 비교, 로그 스케일 점 도표">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; }
    .val { font-variant-numeric: tabular-nums; }
  </style>
  <rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">질의 1건당 LLM 토큰 소모 — 로그 스케일</text>
  <text x="20" y="50" font-size="12" fill="#52514e">GraphRAG-Bench(When to use Graphs in RAG) 실측 · 값은 근사치</text>

  <!-- gridlines: 10^3, 10^4, 10^5 -->
  <line x1="205.7" y1="84" x2="205.7" y2="236" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="377.1" y1="84" x2="377.1" y2="236" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="548.6" y1="84" x2="548.6" y2="236" stroke="#e1e0d9" stroke-width="1"/>

  <!-- rows -->
  <!-- 기본 RAG ~900 -->
  <text x="20" y="104" font-size="13" fill="#0b0b0b">기본 RAG (벡터)</text>
  <line x1="180" y1="100" x2="197.9" y2="100" stroke="#e1e0d9" stroke-width="1"/>
  <circle cx="197.9" cy="100" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text class="val" x="211.9" y="104" font-size="12" fill="#52514e">≈ 900</text>

  <!-- HippoRAG2 ~1,008 -->
  <text x="20" y="144" font-size="13" fill="#0b0b0b">HippoRAG2</text>
  <line x1="180" y1="140" x2="206.3" y2="140" stroke="#e1e0d9" stroke-width="1"/>
  <circle cx="206.3" cy="140" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text class="val" x="220.3" y="144" font-size="12" fill="#52514e">≈ 1,008</text>

  <!-- LightRAG ~100,832 -->
  <text x="20" y="184" font-size="13" fill="#0b0b0b">LightRAG</text>
  <line x1="180" y1="180" x2="549.2" y2="180" stroke="#e1e0d9" stroke-width="1"/>
  <circle cx="549.2" cy="180" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text class="val" x="563.2" y="184" font-size="12" fill="#52514e">≈ 100,832</text>

  <!-- MS GraphRAG global ~331,375 -->
  <text x="20" y="224" font-size="13" fill="#0b0b0b">MS GraphRAG (global)</text>
  <line x1="180" y1="220" x2="637.8" y2="220" stroke="#e1e0d9" stroke-width="1"/>
  <circle cx="637.8" cy="220" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text class="val" x="625.8" y="204" font-size="12" fill="#52514e" text-anchor="end">≈ 331,375</text>

  <!-- axis -->
  <line x1="180" y1="236" x2="660" y2="236" stroke="#c3c2b7" stroke-width="1"/>
  <text class="val" x="205.7" y="256" font-size="11" fill="#898781" text-anchor="middle">1천</text>
  <text class="val" x="377.1" y="256" font-size="11" fill="#898781" text-anchor="middle">1만</text>
  <text class="val" x="548.6" y="256" font-size="11" fill="#898781" text-anchor="middle">10만</text>
  <text x="660" y="256" font-size="11" fill="#898781" text-anchor="end">토큰 (log)</text>

  <text x="20" y="284" font-size="11" fill="#898781">MS global search는 기본 RAG의 약 370배 토큰을 소모 — 같은 질문, 같은 코퍼스 기준</text>
</svg>
