name: CI (dev) — 코드 검증

# ─────────────────────────────────────────────────────────────
# CI 전용. 배포(CD)는 수동입니다 — 절차는 docs/CHECKPOINT_20260616.md 참고.
#   운영 VM(skai2_vm)에서 docker-compose.cslee.yml 로 수동 배포.
# 과거 자동 build/deploy 잡은 ① GitHub 시크릿 미설정 ② 타깃 컴포즈 불일치
#   (docker-compose.yml ≠ 운영 docker-compose.cslee.yml) 로 제거됨.
# 자동 CD가 필요해지면: 시크릿(DOCKER_*, VPS_*) 등록 + cslee 컴포즈 타깃으로 재구성.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - dev
  workflow_dispatch: # 수동 실행 버튼

jobs:
  # 코드 검증 (온톨로지 import + Flask 앱 기동)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 온톨로지 서비스 임포트 검증
        run: |
          python -c "from app.middleware.services.ontology_service import KICSCrimeDomainOntology; \
                     assert len(KICSCrimeDomainOntology.ENTITIES) > 0; \
                     print('✅ 온톨로지 노드:', len(KICSCrimeDomainOntology.ENTITIES), '개'); \
                     print('✅ 온톨로지 엣지:', len(KICSCrimeDomainOntology.RELATIONSHIPS), '개')"

      - name: Flask 앱 시작 검증 (DB 없이)
        env:
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "test"
          DB_USER: "test"
          DB_PASSWORD: "test"
          OPENAI_API_KEY: "sk-test"
        run: |
          timeout 10 python -c "
          import os
          os.environ.setdefault('FLASK_ENV', 'testing')
          from app import create_app
          app = create_app()
          print('✅ Flask 앱 생성 성공')
          " || echo "⚠️ DB 없이 앱 시작 실패 (정상 — DB 연결 필요)"

      - name: 오프라인 단위 테스트 (DB/LLM 불필요, 실패 시 CI 차단)
        env:
          FLASK_ENV: "testing"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "test"
          DB_USER: "test"
          DB_PASSWORD: "test"
          OPENAI_API_KEY: "sk-test"
        run: |
          pytest -q \
            tests/test_security.py \
            tests/test_api_persistence.py \
            tests/test_ontology_transform_viz.py \
            tests/test_t2c_v37_helpers.py \
            tests/test_etl_v40_meta.py
