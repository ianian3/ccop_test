events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    client_max_body_size 50M;

    # ── Rate Limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ui:10m       rate=60r/s;
    limit_req_zone $binary_remote_addr zone=text2cypher:10m rate=10r/m;

    upstream ccop_app { server app:5001; }

    # ── HTTP → HTTPS 리다이렉트 ────────────────────────────────
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS 메인 서버 ────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ccop.cslee.internal;   # CSLEE 내부 도메인으로 변경

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── 보안 헤더 ──────────────────────────────────────────
        add_header X-Frame-Options        SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection       "1; mode=block";
        # CSLEE 플랫폼에서 iframe으로 임베딩 허용할 경우 아래 주석 해제
        # add_header Content-Security-Policy "frame-ancestors 'self' https://cslee-platform.internal";

        # ── CORS (CSLEE 플랫폼 허용) ────────────────────────────
        set $cors_origin "";
        if ($http_origin ~* "^https://(cslee-platform\.internal|localhost)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── 정적 파일 ──────────────────────────────────────────
        location /static {
            alias /usr/share/nginx/html/static;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── 기능 1: Text2Cypher API (엄격한 Rate Limit) ────────
        location /api/v1/text-to-cypher {
            limit_req zone=text2cypher burst=5 nodelay;
            proxy_pass         http://ccop_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;   # LLM 응답 대기
        }

        location /api/v1/agentic-query {
            limit_req zone=text2cypher burst=5 nodelay;
            proxy_pass         http://ccop_app;
            proxy_set_header   Host              $host;
            proxy_read_timeout 180s;   # LangGraph 멀티스텝 대기
        }

        # ── 기능 2: 1-mode/2-mode 투영 API ────────────────────
        location /api/v1/network/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://ccop_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 60s;
        }

        # ── 기능 3: 나머지 API (Graph 관리, ETL 등) ───────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://ccop_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── UI (Graph Modeler, 메인 대시보드) ─────────────────
        location / {
            limit_req zone=ui burst=50 nodelay;
            proxy_pass         http://ccop_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
